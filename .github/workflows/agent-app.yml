# agent-app 质量门禁：push/PR 触及 agent-app 时跑构建 + 类型检查 + 离线自检 + API 测试 + 评测套件
# 全部命令零网络依赖（selftest 用假模型、vitest mock 引擎、eval 的 Tier 2/3 无 key 自动跳过），
# 无需配置任何 Secret
name: agent-app

on:
  push:
    branches: [main]
    paths:
      - "agent-app/**"
      - ".github/workflows/agent-app.yml"
  pull_request:
    paths:
      - "agent-app/**"
      - ".github/workflows/agent-app.yml"

concurrency:
  group: agent-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读取 agent-app/package.json 的 packageManager 字段，本地与 CI 同版本
      - uses: pnpm/action-setup@v4
        with:
          working-directory: agent-app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-app/pnpm-lock.yaml

      # --frozen-lockfile：lockfile 与 package.json 不一致直接报错，杜绝"本地能跑 CI 挂"
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: agent-app

      - name: 构建（shared → engine → api，pnpm 按依赖拓扑序）
        run: pnpm -r build
        working-directory: agent-app

      - name: 类型检查（全包）
        run: pnpm typecheck
        working-directory: agent-app

      - name: 架构边界（引擎分层依赖检查，dependency-cruiser）
        run: pnpm lint:deps
        working-directory: agent-app

      - name: 离线自检（引擎零件 13 项，假模型零网络）
        run: pnpm selftest
        working-directory: agent-app

      # 引擎 vitest 套件（单元 + 集成，含 verification/telemetry/可靠性故障矩阵/
      # 安全链路/门禁/实验台账套件）：全离线零 Secret，infra.* 套件无 Docker 自动跳过
      - name: 引擎测试（vitest，全离线；infra 套件无 Docker 自动跳过）
        run: pnpm --filter @agent-app/engine test
        working-directory: agent-app

      - name: API 测试（vitest 单测 + e2e，引擎调用全部 mock）
        run: pnpm --filter @agent-app/api test
        working-directory: agent-app

      # 教学示例门禁（P2-01）：目录结构完整 + 每例 ≥1 条离线确定性 spec。
      # 假模型驱动（ai/test 同缝），零密钥零网络。
      - name: 示例校验（examples:check——结构 + 离线 spec）
        run: pnpm examples:check
        working-directory: agent-app

      # 课-例-源码-测试映射校验（P2-05）：frontmatter 契约 + lessonId 唯一 +
      # 路径存在性 + examples README 对应课链接 + lastVerifiedCommit 在 main。
      - name: 映射矩阵校验（matrix:check）
        run: pnpm matrix:check
        working-directory: agent-app

  # 评测套件（P3）：CI 无 key → 检索/评审套件自动跳过（跳过 ≠ 失败，退出码 0），
  # Tier 1（轨迹/路由）确定性门禁。零 Secret；基线是 .data 本地文件（不进 git），
  # CI 侧不比对基线，回归门禁只覆盖 Tier 1。
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读取 agent-app/package.json 的 packageManager 字段，本地与 CI 同版本
      - uses: pnpm/action-setup@v4
        with:
          working-directory: agent-app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-app/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: agent-app

      - name: 构建（shared → engine → api，pnpm 按依赖拓扑序）
        run: pnpm -r build
        working-directory: agent-app

      - name: 评测套件（Tier 1 门禁；无 key 时 Tier 2/3 跳过）
        run: pnpm eval
        working-directory: agent-app

      # Phase 4 质量门禁（ci 策略）：必跑套件只含零网络的轨迹/路由——CI 无 key 时
      # 检索/评审被跳过，但 ci 策略不要求它们，缺席不会把门禁打成 inconclusive。
      # 规则里额外含关键用例一票否决与可选检查的 not_applicable 留痕。
      - name: 质量门禁（ci 策略：Tier 1 全绿 + 无关键用例失败）
        run: pnpm quality-gate --gate-policy ci
        working-directory: agent-app

  # Personal Agent P1/P2-A：真实 PG 合约集成，不使用 mock 假装事务可靠性通过。
  platform-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          working-directory: agent-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-app/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: agent-app
      - name: 构建引擎
        run: pnpm --filter @agent-app/engine^... build && pnpm --filter @agent-app/engine build
        working-directory: agent-app
      - name: 真实 PostgreSQL 事务、幂等、会话锁、租约测试
        run: pnpm --filter @agent-app/engine exec vitest run test/platform-store.infra.spec.ts
        working-directory: agent-app
        env:
          RUN_PLATFORM_PG_TESTS: "1"
          PG_CONNECTION_STRING: postgres://agent:agent@localhost:5433/agent
