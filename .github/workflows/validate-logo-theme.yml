# Temporary pre-merge branch validation; remove after green checks.
name: Validate logo-aligned docs theme
on:
  push:
    branches:
      - feat/logo-aligned-blue-cyan-violet-theme
permissions:
  contents: read
jobs:
  theme-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build VitePress docs
        run: pnpm docs:build
      - name: Confirm logo and theme assets
        run: |
          test -s docs/.vitepress/dist/logo.png
          test -s docs/.vitepress/dist/index.html
          grep -q "logo.png" docs/.vitepress/dist/index.html
          if grep -q "豆沙绿" docs/.vitepress/theme/custom.css; then
            echo "Old palette description found"
            exit 1
          fi
